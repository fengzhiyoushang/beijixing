# ═══════════════════════════════════════════════════════════════════════════
# 北极星 · 个人战略终端 —— Nginx 站点配置（前端静态 + API/上传反代 + HTTPS）
# ═══════════════════════════════════════════════════════════════════════════
#
# 【放置位置】Ubuntu 22.04（apt 安装的 nginx）
#     /etc/nginx/sites-available/polaris.conf      ← 复制本文件到这里
#     ln -s /etc/nginx/sites-available/polaris.conf /etc/nginx/sites-enabled/polaris.conf
#     rm -f /etc/nginx/sites-enabled/default        # 让默认站点让位（可选）
#     nginx -t && systemctl reload nginx
#
# 【必须替换的占位符】
#     your.domain.com        → 你已备案并解析到服务器的真实域名（全文共 3 处 server_name / ssl 配置行）
#     /etc/letsencrypt/live/your.domain.com/  → certbot 自动生成的证书目录，同样含域名
#     替换建议：把整份文件里的 your.domain.com 一次性替换成你的域名（vim: :%s/your.domain.com/你的域名/g）
#
# 【HTTPS 证书怎么来】推荐 certbot（自动改写本文件、自动续期）：
#     apt install -y certbot python3-certbot-nginx
#     certbot --nginx -d your.domain.com            # 首次签发并自动配置跳转
#     certbot renew --dry-run                       # 验证自动续期
#   手工签发时：让 ssl_certificate / ssl_certificate_key 指向你的 fullchain.pem / privkey.pem。
#   首次部署若还没有证书，可先把下面 443 那个 server 块整段注释掉，
#   只保留 80 端口 server 块，把它的 listen 80 改为默认站点即可先跑通。
#
# 【路径约定（与 systemd 单元、部署手册保持一致）】
#     前端构建产物：/opt/polaris-terminal/dist      ← polaris-terminal 执行 npm run build 后上传
#     上传文件目录：/opt/polaris-backend/uploads    ← 与后端 UPLOAD_DIR=uploads 同源
#     后端监听地址：127.0.0.1:8000                  ← 由 polaris.service 拉起
#
# 【上传体积】后端 MAX_UPLOAD_MB=20（单文件 20MB），此处放到 30m 留出 multipart 余量
# ═══════════════════════════════════════════════════════════════════════════

# ── 后端上游（仅本机回环，不直接对外暴露 8000）──
upstream polaris_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── 静态资源缓存判定：vite 产物名带 hash，可长缓存 ──
map $uri $polaris_static_cache {
    default                       "no-cache";
    ~*^/assets/.*\.(js|css)$      "public, max-age=31536000, immutable";
    ~*\.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ "public, max-age=2592000";
}

# ═══════════════ 80 端口：全部跳转到 HTTPS ═══════════════
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;          # ← 替换成你的域名

    # certbot http-01 校验与 ACME 续期需要保留这个路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════ 443 端口：前端静态 + API 反代 ═══════════════
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your.domain.com;          # ← 替换成你的域名

    # ── 证书（certbot 生成，目录名含域名，注意同步替换）──
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # ── 字符集与安全响应头 ──
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── 上传体积：后端单文件上限 20MB，这里 30m 留余量 ──
    client_max_body_size 30m;
    client_body_timeout  120s;

    # ── 日志（排查 500/502 时先看这两个文件）──
    access_log /var/log/nginx/polaris.access.log;
    error_log  /var/log/nginx/polaris.error.log warn;

    # ── gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/x-javascript image/svg+xml;

    # ── 前端 SPA：dist 产物；未命中的路径回退 index.html（前端路由用）──
    root /opt/polaris-terminal/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $polaris_static_cache;
    }

    # index.html 绝不缓存，否则前端发版后用户仍加载旧版本
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── 上传文件（用户头像 / 教室照片 / 知识库附件）──
    # 走 Nginx 直接读盘，不经过 uvicorn，省 CPU 且更快
    location /uploads/ {
        alias /opt/polaris-backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ── AI 流式对话（SSE）：必须关闭缓冲，否则前端收不到逐字输出 ──
    # 后端接口：POST /api/v1/ai/chat/stream
    location = /api/v1/ai/chat/stream {
        proxy_pass http://polaris_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;              # 关键：不缓冲响应
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;          # 长回答最长等待 5 分钟
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # ── API 反向代理 ──
    location /api/ {
        proxy_pass http://polaris_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;          # 生成考研计划 / RAG 问答耗时较长
        proxy_send_timeout 300s;
        proxy_buffering off;              # 兼容其余流式接口
    }

    # ── 后端健康检查与接口文档（仅本机可访问，避免公网暴露）──
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://polaris_api;
        proxy_set_header Host $host;
    }

    location /docs {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://polaris_api;
        proxy_set_header Host $host;
    }
}
